name: Build binaries
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: nile_macOS_x86_64
            binary: nile_macOS_x86_64
          - os: macos-15
            artifact: nile_macOS_arm64
            binary: nile_macOS_arm64
          - os: windows-2025
            artifact: nile_windows_x86_64
            binary: nile_windows_x86_64.exe
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version-file: 'pyproject.toml'

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        enable-cache: true

    - name: Install pyinstaller and dependencies
      run: uv sync --extra pyinstaller_build --no-install-local

    - name: Optional dependencies (WebView)
      run: uv sync --extra webview --no-install-local --inexact
      if: runner.os != 'macOS'

    - name: Set strip on Linux and Mac
      id: strip
      run: echo "option=--strip" >> $GITHUB_OUTPUT
      if: runner.os != 'Windows'

    - name: Build
      run: uv run --module PyInstaller
        --onefile
        --name nile
        ${{ steps.strip.outputs.option }}
        nile/cli.py
      env:
        PYTHONOPTIMIZE: 1

    # PyInstaller writes dist/nile (dist/nile.exe on Windows), rename it to
    # the name used by the release assets so artifacts are usable as is
    - name: Rename to release name
      shell: bash
      run: |
        src=dist/nile.exe
        [ -f "$src" ] || src=dist/nile
        mv "$src" "dist/${{ matrix.binary }}"

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: dist/*

  zipapp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: nile_linux_x86_64
            binary: nile_linux_x86_64
          - os: ubuntu-22.04-arm
            artifact: nile_linux_arm64
            binary: nile_linux_arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - run: mkdir -p build dist
      - name: Dependencies
        run: uv export --format requirements.txt --no-editable --no-dev | uv pip install --requirement - --target build
      - run: cp zipapp_main.py build/__main__.py

      - name: Build
        run: python -m zipapp
          --output dist/nile
          --python "/usr/bin/env python3"
          --compress
          build

      - name: Rename to release name
        run: mv dist/nile dist/${{ matrix.binary }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  # On a v* tag, collect the renamed binaries and publish them as release
  # assets. Re-running the workflow updates the assets in place
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, zipapp]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
